name: Sync upstream

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'rea-labs/mne-rt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream main without overwriting local changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Without force, merge conflicts fail instead of discarding local work.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main \
            --jq '"### Upstream synchronization\n\n" + .message' \
            | tee -a "$GITHUB_STEP_SUMMARY"
